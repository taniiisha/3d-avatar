<!DOCTYPE html>
<html ng-app="StreamojiApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streamoji Avatar · Interview Bot</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.2/angular.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r126/three.min.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0b0c10;
      --surface:  #13151c;
      --border:   rgba(255,255,255,0.07);
      --accent:   #c8f060;
      --accent2:  #60d4f0;
      --text:     #eef0f4;
      --muted:    #5c6370;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ── Full page layout ── */
    .page {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      padding: 20px 24px;
      gap: 16px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: blink 2.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .status-chip {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid rgba(200,240,96,0.25);
      color: var(--accent);
      background: rgba(200,240,96,0.07);
      transition: all 0.3s;
    }
    .status-chip.speaking {
      border-color: rgba(200,240,96,0.5);
      background: rgba(200,240,96,0.14);
      box-shadow: 0 0 18px rgba(200,240,96,0.18);
    }

    /* ── Avatar viewport ── */
    .avatar-viewport {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      /* canvas fills this container */
    }

    /* Three.js canvas sits inside here */
    #avatar-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #avatar-canvas canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* subtle inner vignette */
    .avatar-viewport::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: radial-gradient(ellipse 80% 80% at 50% 50%,
        transparent 50%, rgba(11,12,16,0.55) 100%);
      pointer-events: none;
    }

    /* Loading state */
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--surface);
      border-radius: 20px;
      z-index: 20;
      transition: opacity 0.4s ease;
    }
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 2px solid rgba(255,255,255,0.05);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* Debug panel (sits over avatar, top-left) */
    .debug-panel {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(11,12,16,0.88);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      color: var(--accent2);
      max-width: 340px;
      max-height: 200px;
      overflow-y: auto;
      line-height: 1.7;
      display: none;
      backdrop-filter: blur(10px);
    }
    .debug-panel.visible { display: block; }

    /* ── Bottom controls ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-bottom: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 24px;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .btn-speak {
      background: var(--accent);
      color: #0a0b0e;
      min-width: 120px;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(200,240,96,0.2);
    }
    .btn-speak:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(200,240,96,0.32);
    }
    .btn-speak:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-speak.speaking {
      background: #f87171;
      box-shadow: 0 4px 20px rgba(248,113,113,0.2);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      padding: 10px 18px;
    }
    .btn-ghost:hover {
      border-color: rgba(255,255,255,0.15);
      color: var(--text);
    }

    .btn-debug {
      background: rgba(96,212,240,0.05);
      border: 1px solid rgba(96,212,240,0.15);
      color: var(--accent2);
      font-size: 11px;
      padding: 9px 16px;
    }
    .btn-debug:hover {
      background: rgba(96,212,240,0.1);
      border-color: rgba(96,212,240,0.3);
    }

    /* Waveform */
    .waveform {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .waveform.active { opacity: 1; }
    .waveform span {
      display: block;
      width: 3px;
      background: var(--accent);
      border-radius: 3px;
      animation: wave 0.7s ease-in-out infinite;
    }
    .waveform span:nth-child(1) { animation-delay: 0.0s; height: 5px;  }
    .waveform span:nth-child(2) { animation-delay: 0.1s; height: 12px; }
    .waveform span:nth-child(3) { animation-delay: 0.2s; height: 18px; }
    .waveform span:nth-child(4) { animation-delay: 0.1s; height: 10px; }
    .waveform span:nth-child(5) { animation-delay: 0.0s; height: 5px;  }
    @keyframes wave {
      0%,100% { transform: scaleY(0.35); }
      50%      { transform: scaleY(1.0);  }
    }
  </style>
</head>

<body ng-controller="StreamojiController">
<div class="page">

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-name">Interview Bot</span>
    </div>
    <div class="status-chip" ng-class="{'speaking': isSpeaking}">
      {{ isSpeaking ? 'Speaking…' : 'Ready' }}
    </div>
  </div>

  <!-- Avatar viewport -->
  <div class="avatar-viewport">

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loader-label">Loading avatar…</div>
    </div>

    <!-- Debug panel (toggle) -->
    <div class="debug-panel" id="debugPanel">
      <div id="debugContent" style="color:var(--muted)">Loading…</div>
    </div>

    <!-- Three.js renders here -->
    <div id="avatar-canvas"></div>

  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="waveform" ng-class="{'active': isSpeaking}">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <button class="btn btn-speak"
            ng-class="{'speaking': isSpeaking}"
            ng-disabled="!avatarReady || isSpeaking"
            ng-click="speakQuestion()">
      {{ isSpeaking ? '◼ Speaking…' : '▶ Speak' }}
    </button>
    <button class="btn btn-ghost" ng-click="reloadAvatar()">↺ Reload</button>
    <button class="btn btn-debug" ng-click="toggleDebug()">
      {{ showDebug ? 'Hide' : '⬡' }} Mesh Info
    </button>
  </div>

</div>

<script src="app_streamoji.js"></script>
</body>
</html>
